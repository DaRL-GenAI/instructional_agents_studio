<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Instructional Agents Studio: generate a syllabus, slides, lecture scripts, homework, labs and narrated lecture videos in your browser with your own API key. Every agent prompt, response and edit is visible and auditable.">
  <meta name="theme-color" content="#f8f7f3">
  <title>Instructional Agents Studio</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="studio.css?v=1">
</head>
<body>
  <a class="skip-link" href="#panel">Skip to content</a>
  <header class="appbar">
    <a class="product" href="https://darl-genai.github.io/instructional_agents_homepage/" title="Instructional Agents paper homepage">
      <img class="product-mark" src="assets/favicon.svg" width="30" height="30" alt="">
      <span class="product-name">Instructional Agents<span class="brand-dot">.</span> <small>Studio</small></span>
    </a>
    <nav class="top-nav" aria-label="Sections">
      <a href="#setup" data-view="setup">Setup</a>
      <a href="#course" data-view="course">Course</a>
      <a href="#chapters" data-view="chapter">Chapters</a>
      <a href="#audit" data-view="audit">Audit</a>
    </nav>
    <div class="appbar-actions">
      <span id="status-chip" class="chip"></span>
      <span id="busy" class="chip busy" hidden></span>
      <button id="export-all" class="button primary" type="button">Export ZIP <span aria-hidden="true">↓</span></button>
    </div>
  </header>

  <div class="shell">
    <aside class="rail-wrap" aria-label="Pipeline">
      <div class="rail-title">Pipeline</div>
      <nav id="rail" class="rail"></nav>
      <div class="rail-foot">
        <p>Browser edition of <a href="https://github.com/DaRL-GenAI/instructional_agents">instructional_agents</a>. For LaTeX/PDF decks and batch runs use the Python pipeline.</p>
        <p>Related: <a href="https://darl-genai.github.io/EduCAST/">EduCast</a> lesson videos.</p>
      </div>
    </aside>
    <main id="panel" class="panel" tabindex="-1"></main>
    <aside id="live" class="live" hidden aria-live="polite">
      <div class="live-head"><span id="live-agent">Working…</span><button id="live-close" class="icon-button" type="button" aria-label="Hide live panel">×</button></div>
      <pre id="live-text" class="live-text"></pre>
    </aside>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <dialog id="modal" class="modal"></dialog>
  <noscript><p class="lesson-error">Studio needs JavaScript: it runs the whole pipeline in your browser.</p></noscript>
  <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
